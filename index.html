<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8fb"><title>月光剧场 · 角色提示词生成器</title><meta name="description" content="搭配原创角色设定，生成中英双语绘画提示词。"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="navwrap"><a class="brand" href="#studio"><span class="brandmark" aria-hidden="true">☾<b>✦</b></span>月光剧场</a><nav aria-label="主导航"><a href="#studio" data-page="studio"><i data-icon="sliders"></i>创作台</a><a href="#library" data-page="library"><i data-icon="book"></i>素材库</a><a href="#history" data-page="history"><i data-icon="history"></i>历史记录</a></nav><span class="local"><b></b> 本地工作区</span></div></header>
<main><section id="studio">
<div class="hero"><div class="hero-copy"><div class="hero-kicker"><span>✧</span> MOONLIGHT THEATER</div><h1>角色提示词生成器</h1><p>搭配造型、配色与神态，为下一个原创角色写下设定。</p><div class="actions"><button class="primary" id="generate"><i data-icon="dice"></i>随机生成</button><button class="ghost" id="fresh"><i data-icon="spark"></i>全新角色</button></div></div></div>
<section class="panel settings"><div class="section-heading"><span class="iconbox"><i data-icon="sliders"></i></span><h2>生成设置</h2><button class="subtle right" id="moreSettings"><i data-icon="tune"></i>高级设置</button></div>
<div class="fields"><label>风格分支<select id="branch"></select></label><label>绘制画风<select id="style"></select></label><label>探索度 <b class="number" id="exploreValue">18%</b><input type="range" min="0" max="100" id="explore"></label><label>随机种子 <span class="seedinput"><input id="seed" placeholder="输入种子" maxlength="128"><button type="button" id="replay" title="按种子重现" aria-label="按种子重现"><i data-icon="repeat"></i></button></span></label></div></section>
<div class="workgrid"><section class="panel design"><div class="section-heading"><span class="iconbox"><i data-icon="layers"></i></span><h2>角色设计</h2><button class="subtle right" id="unlock"><i data-icon="unlock"></i>全部解锁</button></div><div id="slots"></div><button id="expand" class="more"></button></section>
<section class="panel prompt"><div class="section-heading"><span class="iconbox"><i data-icon="text"></i></span><h2>完整提示词</h2><div class="seg right"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div></div><div class="promptmeta"><span><b></b> 可编辑文本</span><span id="counter"></span></div><textarea id="output" aria-label="完整提示词" spellcheck="false"></textarea><div class="promptactions"><button class="copy" id="copy"><i data-icon="copy"></i>复制提示词</button><button class="secondary" id="exportChar"><i data-icon="download"></i>导出 JSON</button></div><div class="rating"><span>角色设定评价</span><div id="ratings"></div></div></section></div>
</section>
<section id="library" hidden><div class="pagehead"><div><small>MATERIAL LIBRARY</small><h1>素材库</h1></div><div class="actions"><button class="secondary" id="import"><i data-icon="upload"></i>导入配置</button><button class="secondary" id="exportConfig"><i data-icon="download"></i>导出配置</button></div></div><input type="file" accept=".json,application/json" hidden id="file"><div class="panel"><div class="section-heading"><span class="iconbox"><i data-icon="book"></i></span><h2>素材与抽取权重</h2></div><div id="libtabs" class="tabs"></div><div id="materials"></div></div></section>
<section id="history" hidden><div class="pagehead"><div><small>GENERATION HISTORY</small><h1>历史记录</h1></div><span class="subtle">保留最近 100 条</span></div><div id="records"></div></section>
<footer><span>☾ &nbsp; 月光剧场</span><span>Moonlight Theater</span></footer></main><dialog id="dialog"><div class="dialoghead"><h2 id="dtitle"></h2><button id="close" aria-label="关闭"><i data-icon="x"></i></button></div><div id="dbody"></div></dialog><div role="status" id="toast"></div><script type="module" src="app.mjs"></script></body></html>
