<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <filter id="grain">
    <feTurbulence
      type="fractalNoise"
      baseFrequency=".9"
      numOctaves="2"
      stitchTiles="stitch"
      result="noise" />
    <feColorMatrix
      in="noise"
      values=".2126 .7152 .0722 0 0
              .2126 .7152 .0722 0 0
              .2126 .7152 .0722 0 0
              .2126 .7152 .0722 0 0"
      result="gray" />
    <feComponentTransfer in="gray">
      <feFuncA type="linear" slope=".15" intercept=".82" />
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#grain)" />
</svg>
